<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Houdini Wrapped</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0A0A0A;color:#FAF7F0;
       font-family:"Helvetica Neue",Helvetica,"Segoe UI",system-ui,sans-serif;text-align:center}
  .m{font-weight:900;font-size:1.4rem;letter-spacing:-.01em}
  .s{margin-top:.6rem;font-weight:600;opacity:.7;font-size:.95rem}
  a{color:#D6FF3D}
</style>
</head>
<body>
<div>
  <div class="m" id="msg">finding the collector…</div>
  <div class="s" id="sub"></div>
</div>
<script>
// Stable door to a moving house: the collector lives behind a Cloudflare quick
// tunnel whose hostname rotates on every restart (wifi change, reboot). The
// tunnel publishes its current URL to the discovery gist; this page reads it
// and forwards, carrying the visitor's own query string (?key=…&week=…) along.
// No secrets live here — the key stays in the visitor's bookmark.
const DISCOVERY = "https://gist.githubusercontent.com/rahul-memfold/9cda9ab98ad258e59a5df14cae3263ef/raw/houdini-collector.txt";
const msg = (m, s) => { document.getElementById("msg").textContent = m; document.getElementById("sub").innerHTML = s || ""; };
(async () => {
  try {
    const r = await fetch(DISCOVERY + "?t=" + Date.now(), { cache: "no-store" });
    const base = (await r.text()).trim().replace(/\/+$/, "");
    if (!/^https:\/\/[a-z0-9.-]+\.trycloudflare\.com$/.test(base)) throw new Error("bad discovery value");
    const q = new URLSearchParams(location.search);
    const week = q.get("week");
    q.delete("week");
    const target = base + "/v1/wrapped/" + (week ?? "") + (q.toString() ? "?" + q.toString() : "");
    msg("opening the wrapped…");
    location.replace(target);
  } catch (e) {
    msg("the collector is waking up", "its tunnel just moved networks — give it a minute, then <a href=\"javascript:location.reload()\">retry</a>.");
  }
})();
</script>
</body>
</html>
